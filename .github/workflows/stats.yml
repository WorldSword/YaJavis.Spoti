name: Install counter
# Раз в 6 часов собирает счётчик установок (скачивания файлов релиза «stats») в картинку для README.
# Результат лежит в ветке stats-data: stats.svg, badge.json, stats.json.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: install-counter
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/stats.mjs out
      - name: Publish to stats-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b stats-data
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Счётчик установок"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" stats-data
