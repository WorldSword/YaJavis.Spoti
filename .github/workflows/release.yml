name: Build release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require release notes
        run: test -s "docs/releases/${GITHUB_REF_NAME#v}.md"
      - uses: actions/setup-go@v5
        with:
          go-version-file: jarvisd/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Test
        run: |
          (cd jarvisd && go test ./...)
          (cd hardware && go test ./...)
          (cd installer/soloist && go test ./...)
          for f in jarvisd/ui/js/*.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || exit 1; done
          node --check installer/ui/setup.js
      - name: Check concurrency regressions
        run: cd jarvisd && go test -race -run 'Test(PlayerConcurrent|SettingsSnapshot|STT|ServiceHTTPPool|TrainingExport|YouTubeWarm|MiotTypes|AliceMisses|JSPlugin|NativePlugin|PluginsEnsure|BrokenPlugin|OfficialPlugins|Preview|Jitter)' ./...
      - name: Build clean release
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RELEASE: '1'
          GDRIVE_CLIENT: ${{ secrets.GDRIVE_CLIENT }}
          GDRIVE_SECRET: ${{ secrets.GDRIVE_SECRET }}
        run: sh build.sh
      - name: Test installer
        run: cd installer && go test ./...
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already published; keeping its verified assets."
          else
            gh release create "$GITHUB_REF_NAME" build/release/* --verify-tag --title "YaJavis $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
          fi
      - name: Install counter files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/counter-assets.sh "${GITHUB_REF_NAME#v}"
          gh workflow run stats.yml --ref main || true
