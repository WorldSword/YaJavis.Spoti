name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: jarvisd/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Go tests
        # установщик встраивает payload, который появляется только после сборки, — его проверяет release.yml
        run: |
          (cd jarvisd && go vet ./... && go test ./...)
          (cd hardware && go test ./...)
          (cd installer/soloist && go test ./...)
          (cd pluginsdk && go vet ./...)
          (cd plugins/vpn/src && go vet ./... && go test -race ./...)
          go vet scripts/pack-plugins.go
      - name: Race detector
        run: cd jarvisd && go test -race -run 'Test(PlayerConcurrent|SettingsSnapshot|STT|ServiceHTTPPool|TrainingExport|YouTubeWarm|MiotTypes|AliceMisses|JSPlugin|NativePlugin|PluginsEnsure|BrokenPlugin|OfficialPlugins|PluginUpload|Preview|Jitter|VPN)' ./...
      - name: Panel modules
        run: |
          for f in jarvisd/ui/js/*.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || exit 1; done
          node --check installer/ui/setup.js
      - name: Official plugins pack
        run: go run scripts/pack-plugins.go /tmp/plugins
